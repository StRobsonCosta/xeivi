<section class="page-section">
  <h2>Recuperar senha</h2>
  <div class="field"><label>Email</label><input [value]="email" (input)="email = $event.target.value" name="email" /> </div>
  <button (click)="request()">Enviar instruções</button>
  <p class="info" *ngIf="info">{{ info }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>
</section>
