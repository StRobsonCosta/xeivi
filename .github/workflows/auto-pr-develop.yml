name: Auto PR to develop after CI

on:
  push:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

jobs:
  ci-and-create-pr:
    if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/homol' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        run: mvn -B -DskipTests=false verify

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration production || npm run build || true

      - name: Create PR to develop (if none exists)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = process.env.GITHUB_REF.replace('refs/heads/','');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'develop';
            // check existing PRs
            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: owner + ':' + head, base });
            if (prs.length > 0) {
              console.log('PR already exists to develop:', prs[0].html_url);
            } else {
              const title = `Auto PR: ${head} -> develop`;
              const body = `This PR was created automatically after successful CI for branch ${head}.`;
              const { data: pr } = await github.rest.pulls.create({ owner, repo, head, base, title, body });
              console.log('Created PR:', pr.html_url);
            }
